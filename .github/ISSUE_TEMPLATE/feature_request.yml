name: 功能建议
description: 为 SeatMark 座签提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么场景下需要这个功能？
      placeholder: 例如：学校期末考试需要按考场分册打印……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的功能
      description: 希望产品如何支持这个场景？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代做法
      description: 现在你是如何解决的？（可选）
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考截图、同类产品示例等（可选）
