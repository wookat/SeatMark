name: Auto merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for checks then merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PR: ${{ github.event.pull_request.number || '' }}
          REPO: ${{ github.repository }}
        run: |
          merge_pr() {
            pr="$1"
            sha=$(gh api "repos/$REPO/pulls/$pr" --jq '.head.sha')
            draft=$(gh api "repos/$REPO/pulls/$pr" --jq '.draft')
            base=$(gh api "repos/$REPO/pulls/$pr" --jq '.base.ref')
            if [ "$draft" = "true" ] || [ "$base" != "main" ]; then
              echo "PR #$pr skipped (draft=$draft base=$base)"
              return 0
            fi
            for i in $(seq 1 60); do
              runs=$(gh api "repos/$REPO/commits/$sha/check-runs" --paginate \
                --jq '[.check_runs[] | select(.name != "auto-merge")]')
              pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
              failed=$(echo "$runs" | jq '[.[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length')
              echo "PR #$pr checks: pending=$pending failed=$failed"
              if [ "$failed" -gt 0 ]; then
                echo "PR #$pr has a failed check; not merging."
                return 0
              fi
              if [ "$pending" -eq 0 ]; then
                gh pr merge "$pr" --repo "$REPO" --squash --delete-branch || return 0
                echo "PR #$pr merged"
                return 0
              fi
              sleep 20
            done
            echo "PR #$pr timed out waiting for checks; not merging."
          }

          if [ -n "$EVENT_PR" ]; then
            merge_pr "$EVENT_PR"
          else
            # 定时/手动触发：扫描全部 open PR（覆盖 bot 开出的、不触发 pull_request 工作流的 PR）
            for pr in $(gh api "repos/$REPO/pulls?state=open&base=main" --jq '.[].number'); do
              merge_pr "$pr"
            done
          fi
